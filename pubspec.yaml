name: trading_education_app
description: Trade Master — complete trading education with lessons, quizzes, flashcards, and paper trading.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  shared_preferences: ^2.5.2
  url_launcher: ^6.3.1
  web: ^1.1.0
  crypto: ^3.0.6
  http: ^1.2.2
  supabase_flutter: ^2.9.0
  in_app_purchase: ^3.2.1
  in_app_purchase_android: ^0.4.0
  in_app_purchase_storekit: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#03050A"
  adaptive_icon_foreground: assets/branding/app_icon_fg.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#03050A"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#03050A"
    image: assets/branding/splash_logo.png
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/data/case_studies.json
    - assets/data/glossary.json
    - assets/data/homework_rubrics.json
    - assets/data/lesson_quizzes.json
    - assets/data/lessons_en.json
    - assets/data/lessons_es.json
    - assets/data/lessons_pt.json
    - assets/data/lessons_ru.json
    - assets/data/module_quizzes.json
    - assets/data/syllabus.json
  # Bundled so Cyrillic headings render at once, without a network fetch.
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900