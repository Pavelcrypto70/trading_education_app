# Trade Master — Supabase local config
# After `supabase login` + `supabase link --project-ref YOUR_REF`

project_id = "trade-master"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://pavelcrypto70.github.io"
additional_redirect_urls = [
  "https://pavelcrypto70.github.io",
  "http://localhost:3000",
  "http://localhost:8080",
  "http://127.0.0.1:8080",
]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.verify-purchase]
verify_jwt = true

[functions.stripe-checkout]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false
